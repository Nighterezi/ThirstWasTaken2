# Everything that differs per build node. Gradle-only options stay in gradle.properties.
#
# Layered by loader: stonecutter.gradle.kts tags every node with its Minecraft version and its loader,
# so the node `26.2.x-neoforge` reads the top level, then `["26.2.x"]`, what both loaders of that version
# share, and `[neoforge."26.2.x"]`, what only NeoForge has. A key belongs in exactly one table a node
# reads. A loader table is what makes a node: CI and .github/scripts/update_mc_deps.py find nodes by it.
mod.id = "thirstwastaken2"
mod.name = "ThirstWasTaken2"
mod.group = "com.thirstwastaken2"
mod.version = "1.0.9"

deps.fabric_loader = "0.19.5"
# Pinned to a release rather than `1.17-SNAPSHOT`, so the same commit builds the same jars later.
loomx.loom_version = "1.17.21"

# No shared ["1.21.1"] table: the two loaders claim different releases there.
[fabric."1.21.1"]
# One jar for both: nothing the mod touches moved between 1.21 and 1.21.1.
mod.mc_compat = ">=1.21 <=1.21.1"
mod.mc_releases = ["1.21", "1.21.1"]

deps.fabric_api = "0.116.17+1.21.1"
deps.modmenu = "11.0.4"
# 3.0.6+mc1.21, the Fabric upload.
deps.appleskin = "b5ZiCjAr"
deps.cloth_config = "15.0.140+fabric"
deps.jade = "15.10.6+fabric"
deps.farmersdelight = "1.21.1-3.3.6"

[neoforge."1.21.1"]
# NeoForge on 1.21.1 only. 1.21 is NeoForge 21.0, a separate generation, so unlike the Fabric jar this
# one does not claim it.
mod.mc_compat = "[1.21.1,1.21.2)"
mod.mc_releases = ["1.21.1"]

deps.neoforge = "21.1.251"
# 3.0.9+mc1.21, the NeoForge upload.
deps.appleskin = "uAKA6Laj"
deps.cloth_config = "15.0.140+neoforge"
deps.jade = "15.10.6+neoforge"
# Farmer's Delight by vectorwing, the NeoForge original rather than the Refabricated port the Fabric
# tables name, and like there only on the runClient classpath. Only this node sets it: the NeoForge
# nodes on newer Minecraft versions were left without it for now.
deps.farmersdelight = "1.21.1-1.3.4"
# Only this node builds the Sand Filter on NeoForge; see src/main/create/AGENTS.md.
# 6.0.10+mc1.21.1, the NeoForge upload.
deps.create = "UjX6dr61"
# Sophisticated Core, whose upgrades keep water quality and take the Drinking upgrade. Its tanks move
# fluid through IFluidHandler here and through NeoForge's transfer API from 1.21.11, so each generation
# has its own source directory. See src/main/sophisticated/AGENTS.md.
# 1.21.1-1.5.1.2341, the NeoForge upload.
deps.sophisticated_core = "PXl6rB3q"
# 1.21.1-3.26.3.2158, only on the runClient classpath, as the storage the upgrades go in.
deps.sophisticated_backpacks = "AhPnzNtJ"
# 1.21.1-1.5.91.2127, only on the runClient classpath, to check the Drinking upgrade in a placed storage.
deps.sophisticated_storage = "H7wGZ8Sl"

["1.21.11"]
mod.mc_releases = ["1.21.11"]

[fabric."1.21.11"]
mod.mc_compat = "1.21.11"

deps.fabric_api = "0.141.6+1.21.11"
deps.modmenu = "17.0.0"
# 3.0.8+mc1.21.11, the Fabric upload.
deps.appleskin = "59ti1rvg"
deps.cloth_config = "21.11.153+fabric"
deps.jade = "21.1.6+fabric"
deps.farmersdelight = "1.21.11-3.6.16"

[neoforge."1.21.11"]
mod.mc_compat = "[1.21.11,1.21.12)"

deps.neoforge = "21.11.45"
# 3.0.8+mc1.21.11, the NeoForge upload.
deps.appleskin = "MH9ov9DW"
deps.cloth_config = "21.11.153+neoforge"
deps.jade = "21.1.7+neoforge"
# 1.21.11-1.5.0.2340, the NeoForge upload. The transfer-API generation; see src/main/sophisticated/AGENTS.md.
deps.sophisticated_core = "l0tJHroU"
# 1.21.11-3.26.2.2155, only on the runClient classpath.
deps.sophisticated_backpacks = "MPfwVddi"
# 1.21.11-1.5.102.2130, only on the runClient classpath.
deps.sophisticated_storage = "PJ4lJy4t"

["26.1.x"]
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]

[fabric."26.1.x"]
mod.mc_compat = "~26.1"

deps.fabric_api = "0.155.3+26.1.2"
deps.modmenu = "18.0.1"
# 3.0.10+mc26.1.2, the Fabric upload.
deps.appleskin = "zLlqqiTA"
deps.cloth_config = "26.1.154+fabric"
deps.jade = "26.1.11+fabric"
deps.farmersdelight = "26.1-3.6.26"
deps.create_fly = "26.1.2-6.0.9-4"

[neoforge."26.1.x"]
# Compiled against 26.1.2, like the Fabric node.
mod.mc_compat = "[26.1,26.2)"

deps.neoforge = "26.1.2.109"
# 3.0.9+mc26.1, the NeoForge upload.
deps.appleskin = "i8MiVItH"
deps.cloth_config = "26.1.154+neoforge"
# The newest release; 26.1.11+neoforge is a beta.
deps.jade = "26.1.10+neoforge"
# 26.1.2-1.5.0.2334, the NeoForge upload. The transfer-API generation; see src/main/sophisticated/AGENTS.md.
deps.sophisticated_core = "OoXooxvB"
# 26.1.2-3.26.2.2156, only on the runClient classpath.
deps.sophisticated_backpacks = "3xlcYe9r"
# 26.1.2-1.5.113.2133, only on the runClient classpath.
deps.sophisticated_storage = "DGzw01EG"

["26.2.x"]
# Releases to mark compatible when publishing.
mod.mc_releases = ["26.2"]

[fabric."26.2.x"]
# Range written into fabric.mod.json, in Fabric's syntax.
mod.mc_compat = "~26.2"

deps.fabric_api = "0.161.0+26.2"
# Mod Menu, Cloth Config and Jade resolve by version number; Jade's carries its loader as a suffix.
# AppleSkin shares one version number across its Fabric and NeoForge uploads, so it is pinned by
# Modrinth version id instead.
deps.modmenu = "20.0.2"
# 3.0.10+mc26.2, the Fabric upload.
deps.appleskin = "uo5bAN1Y"
deps.cloth_config = "26.2.155+fabric"
deps.jade = "26.2.11+fabric"
# Farmer's Delight Refabricated, only on the runClient classpath. Its version numbers carry the
# Minecraft version as a prefix.
deps.farmersdelight = "26.2-3.6.26"
# Create Fly, the Fabric port of Create. Only nodes that set this compile the Sand Filter; see
# src/main/createfly/AGENTS.md. Its version numbers carry the Minecraft version as a prefix too.
deps.create_fly = "26.2-rc-2-6.0.9-1"

[neoforge."26.2.x"]
# The NeoForge nodes build from the same sources as the Fabric ones; see
# src/main/java/com/thirstwastaken2/platform/AGENTS.md. Create Fly and Farmer's Delight are deliberately
# absent from this NeoForge table: neither had a NeoForge build for 26.2, and `deps.create_fly` is what
# decides whether a node compiles the Sand Filter at all.
# Range written into neoforge.mods.toml, in NeoForge's syntax.
mod.mc_compat = "[26.2,26.3)"

deps.neoforge = "26.2.0.88"
# 3.0.10+mc26.2, the NeoForge upload. Pinned by Modrinth version id for the reason the Fabric table gives.
deps.appleskin = "slnk1Qah"
deps.cloth_config = "26.2.155+neoforge"
deps.jade = "26.2.10+neoforge"
# 26.2-1.5.0.2337, the NeoForge upload. The transfer-API generation; see src/main/sophisticated/AGENTS.md.
deps.sophisticated_core = "HJLJBWYT"
# 26.2-3.26.2.2154, only on the runClient classpath.
deps.sophisticated_backpacks = "LPnOSNVg"
# 26.2-1.5.114.2132, only on the runClient classpath.
deps.sophisticated_storage = "9jOzQdN5"

["26.3.x"]
# Releases to mark compatible when publishing.
mod.mc_releases = ["26.3"]

[fabric."26.3.x"]
mod.mc_compat = "~26.3"

deps.fabric_api = "0.161.0+26.3"
# The only Mod Menu upload built for 26.3 so far. A node stays on the channel its pinned version is on,
# so update_mc_deps.py keeps offering betas here until a 21.0.0 release catches up.
deps.modmenu = "21.0.0-beta.1"
# 3.0.10+mc26.3, the Fabric upload.
deps.appleskin = "PHjDtQay"
deps.cloth_config = "26.3.158+fabric"
deps.jade = "26.3.1+fabric"
deps.farmersdelight = "26.3-3.6.27"
# No `deps.create_fly`: Create Fly has no 26.3 port yet, so this node does not compile the Sand
# Filter. See src/main/createfly/AGENTS.md.

[neoforge."26.3.x"]
# Range written into neoforge.mods.toml, in NeoForge's syntax.
mod.mc_compat = "[26.3,26.4)"

# NeoForge has published only betas for 26.3. This is the newest, and the lower bound players need.
deps.neoforge = "26.3.0.7-beta"
# 3.0.10+mc26.3, the NeoForge upload. Pinned by Modrinth version id for the reason the 26.2 table gives.
deps.appleskin = "6vok7cLb"
deps.jade = "26.3.1+neoforge"
# No `deps.cloth_config`: Cloth Config's 26.3 upload is Fabric only, and it is a runClient convenience
# here rather than something the mod compiles against. Nor `deps.sophisticated_core`, which has no 26.3
# build either, so this node skips the Sophisticated upgrades; see src/main/sophisticated/AGENTS.md.
# Farmer's Delight and Create are absent for the reason the 26.2 table gives.
