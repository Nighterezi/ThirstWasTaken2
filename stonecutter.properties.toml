# Everything that differs per Minecraft version. Gradle-only options stay in gradle.properties.
mod.id = "thirstwastaken2"
mod.name = "ThirstWasTaken2"
mod.group = "com.thirstwastaken2"
mod.version = "1.0.5"

deps.fabric_loader = "0.19.5"
# Pinned to a release rather than `1.17-SNAPSHOT`, so the same commit builds the same jars later.
loomx.loom_version = "1.17.21"

["1.21.1"]
# One jar for both: nothing the mod touches moved between 1.21 and 1.21.1.
mod.mc_compat = ">=1.21 <=1.21.1"
mod.mc_releases = ["1.21", "1.21.1"]

deps.fabric_api = "0.116.17+1.21.1"
deps.modmenu = "11.0.4"
# 3.0.6+mc1.21, the Fabric upload.
deps.appleskin = "b5ZiCjAr"
deps.cloth_config = "15.0.140+fabric"
deps.jade = "15.10.6+fabric"
deps.farmersdelight = "1.21.1-3.3.6"

["1.21.11"]
mod.mc_compat = "1.21.11"
mod.mc_releases = ["1.21.11"]

deps.fabric_api = "0.141.6+1.21.11"
deps.modmenu = "17.0.0"
deps.appleskin = "59ti1rvg"
deps.cloth_config = "21.11.153+fabric"
deps.jade = "21.1.6+fabric"
deps.farmersdelight = "1.21.11-3.6.16"

["26.1.x"]
mod.mc_compat = "~26.1"
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]

deps.fabric_api = "0.155.3+26.1.2"
deps.modmenu = "18.0.1"
deps.appleskin = "zLlqqiTA"
deps.cloth_config = "26.1.154+fabric"
deps.jade = "26.1.11+fabric"
deps.farmersdelight = "26.1-3.6.21"
deps.create_fly = "26.1.2-6.0.9-4"

["26.2.x"]
# Range written into fabric.mod.json.
mod.mc_compat = "~26.2"
# Releases to mark compatible when publishing.
mod.mc_releases = ["26.2"]

deps.fabric_api = "0.160.0+26.2"
# Mod Menu, Cloth Config and Jade resolve by version number; Jade's carries its loader as a suffix.
# AppleSkin shares one version number across its Fabric and NeoForge uploads, so it is pinned by
# Modrinth version id instead.
deps.modmenu = "20.0.2"
deps.appleskin = "uo5bAN1Y"
deps.cloth_config = "26.2.155+fabric"
deps.jade = "26.2.11+fabric"
# Farmer's Delight Refabricated, only on the runClient classpath. Its version numbers carry the
# Minecraft version as a prefix.
deps.farmersdelight = "26.2-3.6.21"
# Create Fly, the Fabric port of Create. Only nodes that set this compile the Sand Filter; see
# src/main/createfly/AGENTS.md. Its version numbers carry the Minecraft version as a prefix too.
deps.create_fly = "26.2-rc-2-6.0.9-1"

["26.2.x-neoforge"]
# The NeoForge node, on the same Minecraft version as 26.2.x and from the same sources. See
# src/main/java/com/thirstwastaken2/platform/AGENTS.md. Create Fly and Farmer's Delight are
# deliberately absent: neither has
# a NeoForge build for 26.2, and `deps.create_fly` is what decides whether a node compiles the Sand
# Filter at all.
mod.mc_compat = "~26.2"
mod.mc_releases = ["26.2"]
# The same range in NeoForge's syntax, written into neoforge.mods.toml. It gets a key of its own
# rather than reusing mod.mc_compat, which is Fabric's spelling of the same thing.
mod.mc_range = "[26.2,26.3)"

deps.neoforge = "26.2.0.88"
# 3.0.10+mc26.2, the NeoForge upload. Pinned by Modrinth version id for the reason 26.2.x gives.
deps.appleskin = "slnk1Qah"
deps.cloth_config = "26.2.155+neoforge"
deps.jade = "26.2.10+neoforge"
