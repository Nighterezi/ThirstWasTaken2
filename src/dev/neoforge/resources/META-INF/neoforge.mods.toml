# The dev tools mod on NeoForge, the counterpart of src/dev/resources/fabric.mod.json. Development
# only, never published. It carries both tools, the agent and /thirst benchmark, the same pair the
# Fabric mod carries. See src/dev/java/AGENTS.md.
modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "thirstwastaken2_dev"
version = "1.0.0"
displayName = "ThirstWasTaken2 Dev Tools"
description = '''Development-only tooling for ThirstWasTaken2: the agent queue and the benchmark. Never published.'''

# Records where the thirst bar was drawn, for the agent's client.hud probe. Client only, so a
# dedicated server never loads the target class and the mixin simply does not apply there.
[[mixins]]
config = "thirstwastaken2.dev.mixins.json"

[[dependencies.thirstwastaken2_dev]]
modId = "thirstwastaken2"
type = "required"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
