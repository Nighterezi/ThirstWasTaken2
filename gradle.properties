org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# The world `runBenchmark` opens, and the seed it is generated with. The benchmark gets a world of its
# own inside the node's run directory, so a run never depends on what was built in the dev world and a
# crash mid-run cannot leave the dev world behind altered. The seed is fixed so that the two nodes of
# one Minecraft version -- the Fabric one and the NeoForge one -- measure the same terrain; worldgen
# differs between Minecraft versions, so the same seed still gives different terrain across versions.
# `-Pthirst.benchmark.seed=<seed>` on a fresh benchmark world measures somewhere else on purpose.
thirst.benchmark.world=thirst-benchmark
thirst.benchmark.seed=8213470596118
