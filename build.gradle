plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
	// Loom supplies the Minecraft and Fabric repositories.
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"thirstwastaken2" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional compile-time counterpart for the original Create integration.
	compileOnly "maven.modrinth:create-fly:26.2-rc-2-6.0.9-1"
	// Optional config-screen entry point; the mod works without Mod Menu installed.
	clientCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	// Test the client HUD and food tooltips alongside AppleSkin in runClient.
	clientCompileOnly "maven.modrinth:appleskin:${project.appleskin_version}"
	clientRuntimeOnly "maven.modrinth:appleskin:${project.appleskin_version}"
	// AppleSkin uses Cloth Config for its Mod Menu configuration screen.
	clientRuntimeOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	// clientRuntimeOnly "maven.modrinth:create-fly:26.2-rc-2-6.0.9-1"
	clientRuntimeOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": project.version }
}

// The client source set currently has Java only. Keep its runtime classpath entry present so Fabric
// Loader does not report build/resources/client as a missing path during runClient.
tasks.named("runClient") {
	doFirst { layout.buildDirectory.dir("resources/client").get().asFile.mkdirs() }
}

// Per-directory notes for contributors; they live next to the files they describe, not in the jars.
tasks.withType(ProcessResources).configureEach {
	exclude "**/CLAUDE.md"
}

// Registered lazily: withSourcesJar() below adds the task after this block is evaluated.
tasks.matching { it.name.endsWith("sourcesJar") }.configureEach {
	exclude "**/CLAUDE.md"
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") { rename { "${it}_${project.name}" } }
}

publishing {
	publications { create("mavenJava", MavenPublication) { from components.java } }
	repositories { }
}
