[versions]
minecraft = "26.2"
fabric-loader = "0.19.3"
fabric-loom = "1.17-SNAPSHOT"
fabric-api = "0.156.0+26.2"
create-fly = "26.2-rc-2-6.0.9-1"
modmenu = "20.0.1"
# Use the Fabric version ID. The human-readable version is shared by the Fabric and NeoForge uploads,
# which can make Modrinth Maven resolve the NeoForge jar instead.
appleskin = "uo5bAN1Y"
cloth-config = "Nv3xnWXd"

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
create-fly = { module = "maven.modrinth:create-fly", version.ref = "create-fly" }

# Optional client-side integration and testing mods.
modmenu = { module = "maven.modrinth:modmenu", version.ref = "modmenu" }
appleskin = { module = "maven.modrinth:appleskin", version.ref = "appleskin" }
cloth-config = { module = "maven.modrinth:cloth-config", version.ref = "cloth-config" }
